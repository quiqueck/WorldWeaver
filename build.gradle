plugins {
    id 'java'
    id 'maven-publish'
    id 'idea'
    id 'eclipse'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}
base.archivesName = project.archives_base_name
java.sourceCompatibility = JavaVersion.VERSION_25
java.targetCompatibility = JavaVersion.VERSION_25


def getDependencies(project, List<String> depNames, configuration) {
    return depNames.iterator().collect {
        project.dependencies.project(path: ":$it", configuration: configuration)
    }
}

apply from: "functions.gradle"
apply from: "common.gradle"
apply from: "common-helper.gradle"
apply from: "common-publish-maven.gradle"
apply from: "common-publish-tag.gradle"

// The root project's DatapackRegistryEntrypointTest scans every module's committed fabric.mod.json
// and Java sources straight off disk. Gradle cannot infer any of that as a task input, so `:test`
// would be reported UP-TO-DATE after a metadata edit and the guard would silently stop running.
// The task is a few cheap file walks, so simply never let it be considered up to date.
tasks.named('test') {
    outputs.upToDateWhen { false }
}
