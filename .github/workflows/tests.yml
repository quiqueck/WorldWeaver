name: Tests

on:
  push:
    branches: [ "1.21", "1.21.6", "1.21.7" ]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-and-gametest:
    name: Unit + GameTest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: JUnit unit tests
        run: ./gradlew test --console=plain --stacktrace

      - name: Headless GameTests
        run: ./gradlew gametestAll --console=plain --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/gametest/report.xml
          if-no-files-found: ignore

  datagen-golden:
    name: Datagen golden-file guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Datagen runs a client in datagen-only mode; wrap in a virtual framebuffer in case GLFW
      # touches a display during startup on the headless runner.
      - name: Verify datagen output matches committed golden files
        run: xvfb-run -a bash tools/verify-datagen.sh --main
