version = project.mod_version
group = project.maven_group


// wunderlib is excluded here: it's a foreign, self-configuring project (applies its own
// fabric-loom conventions and a real loom.splitEnvironmentSourceSets() via wunderlib.gradle).
// Applying fabric-loom to it a second time through this shared block would finalize Loom's
// environment-source-set-split decision before wunderlib.gradle gets a chance to opt into it,
// causing "the value for this property is final and cannot be changed any further".
configure(allprojects.findAll { it.name != 'wunderlib' }) { projIt ->
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'eclipse'
    apply plugin: 'net.fabricmc.fabric-loom'

    repositories {
        maven { url = "https://maven.dblsaiko.net/" }
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.shedaniel.me/" }
        maven { url = 'https://maven.blamejared.com' }
        maven { url = 'https://jitpack.io' }
        maven { url = 'https://maven.terraformersmc.com/releases' }
        maven { url = 'https://maven.terraformersmc.com' }
        maven { url = 'https://maven.ambertation.de/releases' }
    }

    version = rootProject.mod_version
    group = rootProject.maven_group


    java {
        // Must be added before the split source sets are setup.
        withSourcesJar()
    }

    // Must run before anything below references sourceSets.client - this is what creates it,
    // backed by the Fabric convention src/client/java (the same convention wunderlib already
    // uses, see wunderlib.gradle).
    loom {
        splitEnvironmentSourceSets()
    }

    sourceSets {
        main {
            resources {
                srcDirs += [
                        'src/main/generated'
                ]
            }
            java {
                srcDirs += ['src/datagen/java']
            }
        }

        testmod {
            resources {
                srcDirs += [
                        'src/testmod/generated'
                ]
            }
            compileClasspath += main.compileClasspath
            runtimeClasspath += main.runtimeClasspath
        }

        testmodClient {
            compileClasspath += main.compileClasspath
            runtimeClasspath += main.runtimeClasspath

            compileClasspath += client.compileClasspath
            runtimeClasspath += client.runtimeClasspath

            compileClasspath += testmod.compileClasspath
            runtimeClasspath += testmod.runtimeClasspath
        }

        testmodDatagen {
            compileClasspath += main.compileClasspath
            runtimeClasspath += main.runtimeClasspath

            compileClasspath += testmod.compileClasspath
            runtimeClasspath += testmod.runtimeClasspath
            compileClasspath += testmodClient.compileClasspath
            runtimeClasspath += testmodClient.runtimeClasspath
        }
    }

    loom {

        //runtimeOnlyLog4j = true
        runs {
            testmodClient {
                client()
                ideConfigGenerated project.rootProject == project
                name = "Testmod Client"
                source sourceSets.testmodClient
            }
            testmodServer {
                server()
                ideConfigGenerated project.rootProject == project
                name = "Testmod Server"
                runDir "run-server"
                source sourceSets.testmod
            }
            if (project.rootProject != project) {
                println "${projIt.name}-testmod"

                if (projIt.file('src/testmod').exists()) {
                    "${projIt.name}-testmod" {
                        server()
                        runDir "run-server"
                        name = "Testmod - ${projIt.name}"
                        ideConfigGenerated true
                        //source sourceSets["${projIt.name}-testmod"]
                        source sourceSets.testmod
                    }
                }

                // Headless Fabric GameTest run. Generated for any module whose testmod registers a
                // `fabric-gametest` entrypoint in its fabric.mod.json. The run boots a dedicated server
                // headless, executes every @GameTest method, writes a JUnit-style report.xml and exits
                // non-zero if any test fails. See TESTING.md for how to run them and what each covers.
                def testmodModJson = projIt.file('src/testmod/resources/fabric.mod.json')
                if (testmodModJson.exists() && testmodModJson.text.contains('fabric-gametest')) {
                    "${projIt.name}-testmodGametest" {
                        server()
                        runDir "build/gametest"
                        name = "Testmod GameTest - ${projIt.name}"
                        vmArg "-Dfabric-api.gametest"
                        vmArg "-Dfabric-api.gametest.report-file=${file("build/gametest/report.xml")}"
                        ideConfigGenerated true
                        source sourceSets.testmod
                    }
                }

                if (projIt.file('src/testmodClient').exists()) {
                    "${projIt.name}-testmodClient" {
                        client()
                        runDir "run"
                        name = "Testmod Client - ${projIt.name}"
                        ideConfigGenerated true
                        //source sourceSets["${projIt.name}-testmodClient"]
                        source sourceSets.testmodClient
                    }
                }


                if (projIt.file('src/testmodDatagen').exists()) {
                    def modId = projIt.name.replace('-api', '-testmod');
                    "${projIt.name}-testmodDatagen" {
                        client()
                        vmArg "-Dfabric-api.datagen"
                        vmArg "-Dfabric-api.datagen.output-dir=${file("src/testmod/generated")}"
                        vmArg "-Dfabric-api.datagen.modid=${modId}"

                        runDir "build/datagenTestmod"
                        name = "Testmod DataGen - ${projIt.name}"
                        ideConfigGenerated true
                        source sourceSets.testmodDatagen
                    }
                }

                if (projIt.file('src/datagen').exists()) {
                    def modId = projIt.name.replace('-api', '');
                    println("Mod ID: ${modId}")
                    "${projIt.name}-datagen" {
                        client()
                        vmArg "-Dfabric-api.datagen"
                        vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
                        vmArg "-Dfabric-api.datagen.modid=${modId}"

                        runDir "build/datagen"
                        name = "DataGen - ${projIt.name}"
                        ideConfigGenerated true
                    }
                }
            }
        }
    }

    configurations {
        dev {
            transitive true
            canBeResolved = true
            canBeConsumed = true
            extendsFrom api
        }
        localDev {
            extendsFrom dev
        }
        // Client-side counterpart of 'dev': carries a module's own sourceSets.client.output, so
        // moduleDependencies() can wire clientApi the same way it wires api from 'dev'. Without this,
        // a dependent module's client sourceSet only ever sees its dependencies' *main* output - which
        // is what broke once src/client/java stopped being merged into main (splitEnvironmentSourceSets()).
        devClient {
            transitive true
            canBeResolved = true
            canBeConsumed = true
            extendsFrom clientImplementation
        }
    }

    dependencies {
        println("Adding dependencies for ${projIt.name}")
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"

        dev sourceSets.main.output
        devClient sourceSets.client.output

        testmodImplementation sourceSets.main.output
        testmodClientImplementation sourceSets.main.output
        testmodClientImplementation sourceSets.client.output
        testmodClientImplementation sourceSets.testmod.output

        testmodDatagenImplementation sourceSets.main.output
        testmodDatagenImplementation sourceSets.testmod.output
        testmodDatagenImplementation sourceSets.testmodClient.output

        // Plain JUnit 5 unit tests (`src/test/java`, run via `./gradlew test`). fabric-loader-junit
        // bootstraps a headless Fabric/Minecraft classpath so tests that need Bootstrap.bootStrap(),
        // registries or datagen can run without launching a full game; pure-logic tests (e.g. math)
        // need none of that. See TESTING.md.
        testImplementation platform("org.junit:junit-bom:5.11.4")
        testImplementation "org.junit.jupiter:junit-jupiter"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
        testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
        testImplementation sourceSets.main.output

        if (projIt.name != "wunderlib") {
            // alsoInclude=false: only the WorldWeaver aggregator embeds wunderlib
            // (see build.composit.gradle/build.gradle) - sub-modules just need it
            // on their own compile classpath.
            gradle.modApiOrLocal(dependencies, ':wunderlib', "de.ambertation:wunderlib:${project.wunderlib_version}", false)
        }
    }

    processResources {
        println "Version: ${project.mod_version}"
        inputs.property "version", project.mod_version

        filesMatching("fabric.mod.json") {
            expand "version": project.mod_version
        }
    }

    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        it.options.release = 25
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    // JUnit 5 for `src/test/java`. Give the test source set access to the (named/Mojmap) Minecraft
    // classpath from `main` so fabric-loader-junit-based tests can touch registries/datagen; pure
    // tests simply ignore it. Tests are opt-in per module - a module with no `src/test/java` gets a
    // no-op `test` task.
    sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
    sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
    tasks.named('test') {
        useJUnitPlatform()
        testLogging {
            events "passed", "skipped", "failed"
            exceptionFormat "full"
        }
    }

    // Run this task after updating minecraft to regenerate any required resources
    tasks.register('generateResources') {
        group = "fabric"
    }

    tasks.register('testmodJar', Jar) {
        from sourceSets.testmod.output
        from sourceSets.testmodClient.output
        from sourceSets.testmodDatagen.output
        destinationDirectory = new File(project.buildDir, "devlibs")
        archiveClassifier = "testmod"
    }

    [jar, sourcesJar].each {
        it.from(rootProject.file("LICENSE")) {
            rename { "${it}-${project.base.archivesName.get()}" }
        }
    }
}

allprojects.findAll { it.name != 'wunderlib' }.each { p ->
    loom.mods.register(p.name) {
        sourceSet p.sourceSets.main
        sourceSet p.sourceSets.client
    }

    loom.mods.register(p.name + "-testmod") {
        sourceSet p.sourceSets.testmod
        sourceSet p.sourceSets.testmodClient
        sourceSet p.sourceSets.testmodDatagen
    }
}

subprojects.each {
    // Loom 1.15 has no separate remap step - the mod jar is `jar`, not `remapJar`.
    jar.dependsOn("${it.path}:jar")
}

// Aggregate task: run every module's headless Fabric GameTest suite. Each module that declares a
// `fabric-gametest` entrypoint gets a `run<Module>-testmodGametest` task (see the loom runs block
// above); those are wired up lazily by loom, so we collect them after all projects are evaluated.
// Usage: `./gradlew gametestAll`. Pure JUnit tests run separately via `./gradlew test`.
tasks.register('gametestAll') {
    group = 'verification'
    description = 'Runs the headless Fabric GameTest suite for every module that declares one.'
}
gradle.projectsEvaluated {
    subprojects.each { sub ->
        def runName = 'run' + sub.name[0].toUpperCase() + sub.name.substring(1) + '-testmodGametest'
        def gametestTask = sub.tasks.findByName(runName)
        if (gametestTask != null) {
            tasks.named('gametestAll').configure { dependsOn gametestTask }
        }
    }
}

// The global "Data Generation" run (task runDatagen, defined in the loom runs
// block below) only generates the root project's own resources. Each module
// with a src/datagen dir gets its own run<Module>-datagen task (same loom
// runs block above) - wire those in too, so a single runDatagen invocation
// regenerates everything. Deliberately excludes each module's separate
// run<Module>-testmodDatagen task (testmod fixtures, not real content).
gradle.projectsEvaluated {
    subprojects.each { sub ->
        def runName = 'run' + sub.name[0].toUpperCase() + sub.name.substring(1) + '-datagen'
        def datagenTask = sub.tasks.findByName(runName)
        if (datagenTask != null) {
            tasks.named('runDatagen').configure { dependsOn datagenTask }
        }
    }
}

tasks.sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}


//dependencies for the main Libraray
dependencies {
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    subprojects.each {
        api project(path: "${it.path}", configuration: "dev")
        if (it.name != "wunderlib") {
            // wunderlib is foreign and self-configuring (see common.gradle's top-of-file note) - it
            // never gets the devClient configuration the shared configure(allprojects...) block sets up.
            clientImplementation project(path: "${it.path}", configuration: "devClient")
        }

//        testmodImplementation project("${it.path}").sourceSets.testmod.output
//        testmodClientImplementation project("${it.path}").sourceSets.testmodClient.output
//        testmodClientImplementation project("${it.path}").sourceSets.client.output
//
//        testmodDatagenImplementation project("${it.path}").sourceSets.testmodDatagen.output

        include project("${it.path}")
    }
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

    gradle.modApiOrLocal(dependencies, ':wunderlib', "de.ambertation:wunderlib:${project.wunderlib_version}")
}

// Aggregator maven publishing lives in common-publish-maven.gradle (applied from
// build.gradle) - the wover-* submodules are bundled directly into this project's
// jar by the `include project(...)` above, so they are never published separately.

loom {
    runs {
        datagen {
            inherit client
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=${project.archives_base_name}"

            runDir "build/datagen"
        }
    }

    subprojects.each { sub ->
        //println "${sub.loom.accessWidenerPath.text}"
        try {

        } catch (e) {
            println "No access widener for ${sub.name}"
        }

    }
    accessWidenerPath = file("src/main/resources/wover.accesswidener")

    enableTransitiveAccessWideners = true
}

task copyHighlightJs(type: Copy) {
    from 'javadoc/contrib' // Path to the local folder containing Highlight.js
    into "$buildDir/docs/javadoc/contrib" // Specify the destination folder in the generated Javadoc
}


javadoc {
    options {
        source = "25"
        encoding = "UTF-8"
        charSet = "UTF-8"
        memberLevel = JavadocMemberLevel.PROTECTED
        links("https://docs.oracle.com/en/java/javase/25/docs/api/")
        // Disable the crazy super-strict doclint tool in Java 8
        addStringOption("Xdoclint:none", "-quiet")
        addStringOption("noqualifier", "net.minecraft.*:com.mojang.*:net.fabricmc.*")
        addBooleanOption("-allow-script-in-comments", true)
        tags(
                'apiNote:a:API Note:',
                'implSpec:a:Implementation Requirements:',
                'implNote:a:Implementation Note:'
        )
        header = "<script type=\"text/javascript\" src=\"../../../../../contrib/highlight/highlight.min.js\"></script>" +
                " <link rel=\"stylesheet\" href=\"../../../../../contrib/highlight/styles/default.min.css\"></link>" +
                " <script>window.onload = function () {\n" +
                "    var allPre, i, j;\n" +
                "    allPre = document.getElementsByTagName(\"pre\");\n" +
                "    console.log(allPre); \n" +
                "    for (i = 0, j = allPre.length; i < j; i++) {\n" +
                "        hljs.highlightElement(allPre[i]);\n" +
                "    }\n" +
                "};</script>"

        stylesheetFile = file("javadoc/wover.css")
    }


    allprojects.each {
        source(it.sourceSets.main.allJava)
    }

    classpath = files(sourceSets.main.compileClasspath, sourceSets.main.runtimeClasspath)
    include("**/api/**")
    include("de/ambertation/wunderlib/**")
    include("de/ambertation/wover/util/**")
    // Mixins target private/final vanilla members via access widening, which javadoc's
    // compiler does not apply - they can never be part of the documented API surface.
    exclude("**/mixin/**")
    failOnError true

    finalizedBy copyHighlightJs
}

jar {
    from "LICENSE"
}

configurations {
    dev {
        canBeConsumed true
        canBeResolved true
    }
    localDev {
        extendsFrom dev
    }
}

task javadocJar(type: Jar, dependsOn: [javadoc, copyHighlightJs]) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

artifacts {
    // Loom 1.15 has no separate remap step, so `jar` is already the named/dev jar
    // that local composite-included projects (BCLib, BetterEnd) consume via 'dev'/
    // 'localDev' in the named dev namespace.
    localDev jar
}
// Gradle 9 no longer takes ad-hoc artifacts on the legacy `archives` configuration;
// wire the extra jars into `assemble` instead.
tasks.assemble.dependsOn(sourcesJar, javadocJar)

idea {
    module {
        excludeDirs += file('javadoc')
        excludeDirs += file('gradle')
        excludeDirs += file('public')
        excludeDirs += file('tools')
        excludeDirs += file('bin')
        subprojects.each {
            excludeDirs += it.file('run')
            excludeDirs += it.file('run-server')
        }
    }
}
